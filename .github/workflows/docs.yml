name: Docs

on:
  push:
    branches:
      - main
  release:
    # Versioned docs deploy when a release is published (a promoted release
    # candidate), not when a candidate tag is created.
    types: [released]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install mkdocs-material mkdocs-minify-plugin mike

      - name: Build
        run: mkdocs build --strict

  deploy-dev:
    name: Deploy dev docs
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Only the latest main matters: newer dev deploys replace queued ones.
    concurrency:
      group: gh-pages-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install mkdocs-material mkdocs-minify-plugin mike

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy dev alias
        run: |
          # Retry if another deploy pushed to gh-pages first.
          for i in 1 2 3; do
            git fetch origin +gh-pages:gh-pages 2>/dev/null || true
            mike deploy dev --push && exit 0
            sleep $((i * 10))
          done
          exit 1

  deploy-release:
    name: Deploy versioned docs
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install mkdocs-material mkdocs-minify-plugin mike

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "v=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy versioned docs
        run: |
          # Retry if a dev-docs deploy pushed to gh-pages first.
          for i in 1 2 3; do
            git fetch origin +gh-pages:gh-pages 2>/dev/null || true
            mike deploy "${{ steps.ver.outputs.v }}" latest --update-aliases --push \
              && mike set-default latest --push && exit 0
            sleep $((i * 10))
          done
          exit 1
